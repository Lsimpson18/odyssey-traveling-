<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B2E3A">
  <title>Odyssey Travel Co | Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="phone">

  <header class="hero">
    <svg class="hero-art" viewBox="0 0 420 340" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
      <g fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.2">
        <circle cx="352" cy="70" r="96"/>
        <ellipse cx="352" cy="70" rx="40" ry="96"/>
        <ellipse cx="352" cy="70" rx="76" ry="96"/>
        <path d="M256 70h192M270 30h164M270 110h164"/>
      </g>
      <path d="M20 300 C 90 200, 170 310, 240 200 S 330 90, 372 62" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="1 8"/>
      <circle cx="20" cy="300" r="4" fill="#E3A72F"/>
      <g class="plane">
        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" transform="translate(-14 -14) scale(1.15) rotate(90 12 12)" fill="#fff"/>
      </g>
    </svg>

    <div class="brand" aria-label="Odyssey Travel Co">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="none" stroke="#E3A72F" stroke-width="2"/>
        <circle cx="24" cy="24" r="16.5" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1" stroke-dasharray="1.5 3"/>
        <g transform="rotate(35 24 24)">
          <path d="M24 7l5.2 17H18.8z" fill="#E3A72F"/>
          <path d="M24 41l-5.2-17h10.4z" fill="#fff"/>
        </g>
        <circle cx="24" cy="24" r="2.2" fill="#0B2E3A"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">ODYSSEY</span>
        <span class="brand-sub">TRAVEL CO</span>
      </div>
    </div>

    <h1 class="welcome">Welcome to Odyssey</h1>
    <p class="akwaba" lang="ak">Akwaba</p>
    <p class="meaning">Ghanaian for “welcome”</p>
    <p class="tagline">Your journey begins here.</p>
  </header>

  <section class="sheet">

    <!-- Sign in -->
    <div id="view-signin" data-view>
      <form data-action="login" novalidate>
        <div class="field">
          <label for="si-email">Email address</label>
          <div class="control">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
            <input id="si-email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="Enter your email" required>
          </div>
        </div>
        <div class="field">
          <label for="si-pass">Password</label>
          <div class="control">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
            <input id="si-pass" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button class="eye" type="button" aria-label="Show password" aria-pressed="false">
              <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4"/><path d="M6.6 6.7C3.6 8.6 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
        </div>
        <div class="row-end"><button class="link" type="button" data-go="forgot">Forgot password?</button></div>
        <p class="msg" role="alert" hidden></p>
        <button class="primary" type="submit">Sign In</button>
      </form>
      <p class="switch">Don’t have an account? <button class="link strong" type="button" data-go="signup">Sign Up</button></p>
    </div>

    <!-- Sign up -->
    <div id="view-signup" data-view hidden>
      <form data-action="register" novalidate>
        <div class="field">
          <label for="su-name">Full name</label>
          <div class="control">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.8-3.6 3.8-5.5 7.5-5.5s6.7 1.9 7.5 5.5"/></svg>
            <input id="su-name" name="name" type="text" autocomplete="name" placeholder="Enter your full name" required>
          </div>
        </div>
        <div class="field">
          <label for="su-email">Email address</label>
          <div class="control">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
            <input id="su-email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="Enter your email" required>
          </div>
        </div>
        <div class="field">
          <label for="su-pass">Password</label>
          <div class="control">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
            <input id="su-pass" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
            <button class="eye" type="button" aria-label="Show password" aria-pressed="false">
              <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4"/><path d="M6.6 6.7C3.6 8.6 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
        </div>
        <p class="msg" role="alert" hidden></p>
        <button class="primary" type="submit">Create Account</button>
      </form>
      <p class="switch">Already have an account? <button class="link strong" type="button" data-go="signin">Sign In</button></p>
    </div>

    <!-- Forgot password -->
    <div id="view-forgot" data-view hidden>
      <form data-action="forgot-password" novalidate>
        <p class="lead">Enter the email you signed up with and we’ll send you a reset link.</p>
        <div class="field">
          <label for="fp-email">Email address</label>
          <div class="control">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
            <input id="fp-email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="Enter your email" required>
          </div>
        </div>
        <p class="msg" role="alert" hidden></p>
        <button class="primary" type="submit">Send Reset Link</button>
      </form>
      <p class="switch"><button class="link strong" type="button" data-go="signin">Back to Sign In</button></p>
    </div>

    <!-- Signed in -->
    <div id="view-home" data-view hidden>
      <h2 class="home-title">Akwaba, <span id="home-name"></span>.</h2>
      <p class="lead">You’re signed in. Your trips and bookings will appear here.</p>
      <button class="primary" type="button" id="logout">Sign Out</button>
    </div>

  </section>
</main>
<script src="app.js"></script>
</body>
</html>
